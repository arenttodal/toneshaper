name: Build

on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsp-tests:
    name: DSP tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build tests
        run: |
          cmake -S . -B build -DTONESHAPER_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Run tests
        run: ./build/toneshaper_tests

  macos:
    name: macOS universal build
    runs-on: macos-15
    timeout-minutes: 75
    env:
      ARTEFACTS: build/src/plugin/ToneShaper_artefacts/Release
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          cmake --version

      - name: Version
        id: version
        run: |
          VERSION=$(sed -n 's/^project(ToneShaper VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run DSP tests
        run: ./build/toneshaper_tests

      - name: Check universal binaries
        run: |
          lipo -info "$ARTEFACTS/AU/ToneShaper.component/Contents/MacOS/ToneShaper"
          lipo -info "$ARTEFACTS/VST3/ToneShaper.vst3/Contents/MacOS/ToneShaper"
          lipo -info "$ARTEFACTS/Standalone/ToneShaper.app/Contents/MacOS/ToneShaper"
          for f in AU/ToneShaper.component VST3/ToneShaper.vst3 Standalone/ToneShaper.app; do
            bin="$ARTEFACTS/$f/Contents/MacOS/ToneShaper"
            lipo "$bin" -verify_arch arm64 x86_64
          done

      - name: Ad-hoc code sign
        run: |
          for f in AU/ToneShaper.component VST3/ToneShaper.vst3 Standalone/ToneShaper.app; do
            codesign --force --deep --sign - --timestamp=none "$ARTEFACTS/$f"
            codesign --verify --deep --strict --verbose=2 "$ARTEFACTS/$f"
          done

      - name: Package
        run: packaging/package_macos.sh "$ARTEFACTS" dist "${{ steps.version.outputs.version }}"

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: ToneShaper-${{ steps.version.outputs.version }}-macOS
          path: dist/*
          if-no-files-found: error

      - name: Validate Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          ditto "$ARTEFACTS/AU/ToneShaper.component" ~/Library/Audio/Plug-Ins/Components/ToneShaper.component
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i toneshaper || true
          auval -v aufx Tnsh Atdl

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          $PV --strictness-level 7 --validate-in-process --timeout-ms 600000 --output-dir pluginval-logs \
              "$ARTEFACTS/VST3/ToneShaper.vst3"
          $PV --strictness-level 7 --validate-in-process --timeout-ms 600000 --output-dir pluginval-logs \
              ~/Library/Audio/Plug-Ins/Components/ToneShaper.component

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pluginval-logs
          path: pluginval-logs
          if-no-files-found: ignore

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('macos-build-{0}', github.run_number) }}
          name: ToneShaper ${{ steps.version.outputs.version }} for macOS (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: dist/*
          body: |
            Universal (Apple Silicon + Intel) macOS build of ToneShaper — AU, VST3 and Standalone.
            Built from `${{ github.sha }}` on `${{ github.ref_name }}`; passed the DSP test suite, auval and pluginval (strictness 7).

            **Install**
            - `ToneShaper-${{ steps.version.outputs.version }}-macOS.pkg` — installer, puts the AU and VST3 in `/Library/Audio/Plug-Ins` and the app in `/Applications`.
            - `ToneShaper-${{ steps.version.outputs.version }}-macOS.zip` — the bundles plus `Install ToneShaper.command` (per-user install, no admin password).

            The build is ad-hoc signed, not notarised. If macOS says it can't verify the developer, right-click the file and choose **Open**, or allow it under **System Settings → Privacy & Security → Open Anyway**.
